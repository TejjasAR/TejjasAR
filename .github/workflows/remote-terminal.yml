name: Remote terminal

# Visitors run commands on the profile by opening an issue titled `cmd: <command>`.
# The script executes from a strict allowlist, updates the README transcript,
# then this workflow commits it and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: remote-terminal
  cancel-in-progress: false

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: term
        run: python scripts/remote_terminal.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - if: steps.term.outputs.ran == 'true'
        run: |
          git config user.name "tejjas-os"
          git config user.email "tejjas-os@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "terminal: @${{ github.event.issue.user.login }} ran a command"
          git push

      - if: steps.term.outputs.ran == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: n,
              body: 'command executed ✅ — refresh the profile to see the output in the remote terminal.'
            });
            await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed' });
