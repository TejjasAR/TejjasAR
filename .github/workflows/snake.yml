name: Generate contribution snake

# The classic snake, reskinned: a golden star-serpent devouring the contribution
# grid on pure black. snk generates, scripts/space_snake.py recolors.

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolor to deep-space palette
        run: python scripts/space_snake.py "dist/*.svg"

      - name: Push to output branch
        run: |
          set -e
          git config user.name "deep-field-relay"
          git config user.email "deep-field-relay@users.noreply.github.com"
          git fetch origin output 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout output
            git pull --rebase origin output 2>/dev/null || true
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp dist/github-snake.svg dist/github-snake-dark.svg ./
          git add github-snake.svg github-snake-dark.svg
          git diff --cached --quiet || git commit -m "update star-serpent"
          git push origin output
