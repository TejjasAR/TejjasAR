name: Comms log

# Visitors transmit signals to the profile by opening an issue titled `cmd: <signal>`.
# The script resolves the signal from a strict allowlist and regenerates
# assets/battle-log.svg, then this workflow commits it and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: comms-log
  cancel-in-progress: false

jobs:
  transmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: signal
        run: python scripts/battle_log.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - if: steps.signal.outputs.ran == 'true'
        run: |
          git config user.name "deep-space-relay"
          git config user.email "deep-space-relay@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "comms: @${{ github.event.issue.user.login }} transmitted a signal"
          git push

      - if: steps.signal.outputs.ran == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: n,
              body: 'signal received 📡 — refresh the profile to see it in the comms log.'
            });
            await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed' });
